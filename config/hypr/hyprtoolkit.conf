# ==============================================================================
# Hyprtoolkit - TokyoNight Theme Configuration
# ~/.config/hypr/hyprtoolkit.conf
# ==============================================================================

# --- TokyoNight Color Palette ---
background = 0xFF1a1b26
base = 0xFF24283b
text = 0xFFc0caf5
alternate_base = 0xFF2f354f
bright_text = 0xFFffffff
link_text = 0xFF7dcfff
accent = 0xFF7aa2f7
accent_secondary = 0xFFbb9af7

# --- Typography & Font Sizes ---
font_family = CaskaydiaCove Nerd Font
font_family_monospace = CaskaydiaCove Nerd Font Mono

font_size = 12
small_font_size = 10
h1_size = 18
h2_size = 15
h3_size = 13

# --- Icon Theme ---
icon_theme = Adwaita

# --- Geometry & Rounding ---
rounding_large = 12
rounding_small = 6
